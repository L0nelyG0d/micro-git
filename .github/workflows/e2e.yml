# E2E: the built image on Postgres 16 (Playwright suite in e2e/), plus the
# SQLite integration smoke (make smoke-sqlite). Mechanical gate for deploy.yml:
# deploy runs only when this workflow and CI both succeed for the same commit.
# No repository secrets are needed; the database is the compose `db` service (throwaway).
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright, Docker image on Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Guard - Playwright suite present
        run: |
          if [ ! -f e2e/package.json ]; then
            echo "e2e/package.json not found: the Playwright suite is not on this commit yet."
            exit 1
          fi

      - name: Generate JWT secret
        # docker compose (next step) builds its own image and starts its own
        # Postgres (db service); only JWT_SECRET is read from the job environment.
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      - name: Start the stack (docker compose up --wait)
        # docker-compose.yml starts its own Postgres (db service) and reads
        # POSTGRES_* and JWT_SECRET from the environment; the backend is
        # published on 8080. REGISTER_MAX_PER_IP lifts the per-IP register
        # limit for this test stack only (the e2e suite signs up one user per test).
        env:
          POSTGRES_USER: mg
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: mg
          REGISTER_MAX_PER_IP: "1000"
        run: docker compose up -d --wait

      - name: Install Playwright (Chromium)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Compose logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color --tail 300

      - name: Tear down the stack
        if: ${{ always() }}
        env:
          # Compose validates the same variables on teardown; values are not used.
          POSTGRES_USER: mg
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: mg
        run: docker compose down -v

  integration-sqlite:
    name: Integration smoke (make smoke-sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (make setup)
        run: make setup
      - name: Smoke (real frontend proxy + real backend on a temp SQLite file)
        run: make smoke-sqlite
