services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mg-app:local
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      STORE: db
      DB_DRIVER: postgres
      DATABASE_URL: "postgres://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env (at least 32 bytes)}"
      COOKIE_SECURE: "${COOKIE_SECURE:-}"
      # Test stacks only: raise the per-IP register limit (empty = default 10).
      REGISTER_MAX_PER_IP: "${REGISTER_MAX_PER_IP:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The app's Postgres store does not create tables itself; the schema is
      # applied once, on the first start of an empty volume.
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
