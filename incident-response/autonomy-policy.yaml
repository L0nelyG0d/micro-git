{
  "_comment": "JSON-compatible YAML (parsed by policy-check.py without dependencies). The model proposes an action_id plus params; this file decides and policy-check.py BUILDS the command. The model never writes a command.",
  "version": 2,
  "confidence_threshold": 0.7,
  "max_automatic_actions_per_incident": 1,
  "global_cooldown_seconds": 300,
  "_templates": "argv elements are literal, or the whole element '{{COMPOSE_ARGS}}' (expands to the -p/-f flags built from $COMPOSE_PROJECT_NAME and $COMPOSE_FILES by the system), or '{{param:NAME}}' (a validated parameter value, one argv element). Unset COMPOSE_FILES = no command can be built = escalate (fail closed). rollback was removed: root compose hardcodes mg-app:local. Neither action takes parameters today.",
  "on_violation": "escalate",
  "allowed_actions": {
    "restart_app": {
      "types": ["restart"],
      "description": "Restart the app container",
      "env": {},
      "argv": ["docker", "compose", "{{COMPOSE_ARGS}}", "restart", "app"],
      "params": {}
    },
    "fault_off": {
      "types": ["config_change"],
      "description": "Set env flag FAULT_ENDPOINT_500 to empty (off) and recreate the app container",
      "env": {"FAULT_ENDPOINT_500": ""},
      "argv": ["docker", "compose", "{{COMPOSE_ARGS}}", "up", "-d", "--no-deps", "app"],
      "params": {}
    }
  },
  "_params": "params: {NAME: {\"enum\": [...]} or {\"regex\": \"^...$\"}}; every declared param is required; values are strings, matched with an anchored full match, and always rejected when they contain whitespace/shell metacharacters or start with '-'.",
  "propose_only_types": ["code_fix_pr", "escalate"],
  "denied_patterns": [
    {"id": "db-write", "regex": "(?i)\\b(psql|pg_dump|pg_restore|sqlite3|mysql)\\b|\\b(insert|update|delete|drop|truncate|alter|create)\\s+(into|from|table|database|index)\\b|\\bdocker compose (exec|run)\\b.*\\bdb\\b|migrate"},
    {"id": "secrets", "regex": "(?i)\\.env\\b|secret|token|password|credential|id_rsa|\\.pem\\b|printenv|aws_|ssh "},
    {"id": "force-push", "regex": "(?i)git\\s+push|--force"},
    {"id": "prod-deploy", "regex": "(?i)\\b(deploy|kubectl|terraform|helm|flyctl|railway|vercel|gcloud|aws)\\b"},
    {"id": "shell-metachar", "regex": "[;&|`$<>\\n(){}\\\\]"}
  ],
  "_denied_patterns": "Applied to every param value (the only model-supplied text that reaches a command). Free-text fields (summary, root_cause_hypothesis, risk) are never executed and are not scanned.",
  "escalation": {"packet_file": "escalation-packet.json", "notify": "write file only; a human reads it"}
}
