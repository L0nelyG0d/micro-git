# Render Blueprint: the root Dockerfile as a web service, plus managed Postgres.
# Apply: Render dashboard > New > Blueprint > pick this repo; the file path is deploy/render.yaml
# (set the Blueprint file path to deploy/render.yaml in the dialog). Free plans are for trying it out:
# the free web service sleeps when idle and the free Postgres expires after 30 days.
services:
  - type: web
    name: micro-git
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    # Off on purpose: the CI/E2E-gated deploy hook is the only deploy trigger.
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: STORE
        value: db
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mg-db
          property: connectionString
      - key: APPLY_SCHEMA
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ENV
        value: dev

databases:
  - name: mg-db
    databaseName: mg
    user: mg
    plan: free
