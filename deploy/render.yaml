# Render Blueprint: the root Dockerfile as a web service, plus managed Postgres.
# Apply: Render dashboard > New > Blueprint > pick this repo; the file path is deploy/render.yaml
# (set the Blueprint file path to deploy/render.yaml in the dialog). Free plans are for trying it out:
# the free web service sleeps when idle and the free Postgres expires after 30 days.
services:
  - type: web
    name: mg
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: STORE
        value: db
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mg-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: mg-db
    databaseName: mg
    user: mg
    plan: free
