route:
  receiver: local-responder
  group_by: [alertname, route]
  group_wait: 5s
  group_interval: 1m
  repeat_interval: 1h
receivers:
  - name: local-responder
    webhook_configs:
      - url: http://host.docker.internal:9099/alert
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/alert-token
