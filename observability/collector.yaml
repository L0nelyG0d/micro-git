# OpenTelemetry Collector (contrib). Single pipeline hub:
#   metrics: scrape app:8080/metrics + OTLP -> Prometheus (remote write)
#   traces : OTLP (from app)                -> Tempo
#   logs   : docker json-file logs          -> Loki (native OTLP endpoint)
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: micro-git
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["app:8080"]
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # Reads container stdout via Docker's json-file driver. Needs the host
  # /var/lib/docker/containers mount (see compose.yaml) and root.
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    operators:
      - type: json_parser          # docker envelope: {"log": "...", "stream": ..., "time": ...}
        parse_from: body
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      - type: move
        from: attributes.log
        to: body
      - type: remove
        field: attributes.time
      - type: remove
        field: attributes.stream

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  batch: {}
  # Keep only the app's structured request logs (other containers' lines have no "route").
  filter/applogs:
    error_mode: ignore
    logs:
      log_record:
        - 'not IsMatch(body, "\"route\"")'
  resource/applogs:
    attributes:
      - {key: service.name, value: micro-git, action: upsert}

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [prometheus, otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, filter/applogs, resource/applogs, batch]
      exporters: [otlphttp/loki]
